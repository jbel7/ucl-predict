{% extends 'project/base.html' %}

{% block title %}Prediction saved · UCLPredict{% endblock %}

{% block content %}
<section class="dark page-head">
    <div class="wrap">
        <p class="eyebrow">✓ Saved</p>
        <h1 class="display">Prediction <span class="accent">locked in.</span></h1>
        <p class="lede">Your match prediction has been saved.</p>
        <div class="btn-row" style="margin-top: 32px;">
            {% if user.is_authenticated %}
            <a href="{% url 'project:saved_predictions' %}" class="btn btn-primary">View my predictions <span class="arrow">→</span></a>
            {% endif %}
            <a href="{% url 'project:predictor' %}" class="btn">Make another</a>
        </div>
    </div>
</section>
{% endblock %}
